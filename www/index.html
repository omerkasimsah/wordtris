        body { background-color: #040c1a; color: white; font-family: 'Nunito', sans-serif; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
        .clash-font { font-family: 'Titan One', cursive; letter-spacing: 1px; }
        .rune-font { font-family: 'Rajdhani', sans-serif; font-weight: 700; letter-spacing: 2px; }
        .sahtar-logo { font-family: 'Bungee Inline', cursive; }

        /* ===== CYBER-RUNE CORE PALETTE ===== */
        :root {
            --cyan: #00f5ff;
            --magenta: #ff2d9c;
            --amber: #ffb300;
            --obsidian: #0a0e1a;
        }

        /* LOADER */
        #loader { position: fixed; inset: 0; background: #040c1a; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

        /* CARD SHINE */
        .card-shine { position: relative; overflow: hidden; }
        .card-shine::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(to bottom right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.05) 40%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0.05) 60%, rgba(255,255,255,0) 100%); transform: rotate(30deg); animation: shine 4s infinite; pointer-events: none; }
        @keyframes shine { 0% { transform: translateX(-100%) rotate(30deg); } 100% { transform: translateX(100%) rotate(30deg); } }

        /* NAV BAR - frosted glass */
        .nav-bar { background: rgba(4,12,26,0.92); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-top: 1px solid rgba(0,245,255,0.08); }

        /* TOP HUD - frosted glass panel */
        .hud-panel {
            background: rgba(4,12,26,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,245,255,0.15);
            box-shadow: 0 4px 24px rgba(0,0,0,0.6), inset 0 1px 0 rgba(0,245,255,0.1);
        }

        /* ===== BLOCK STYLES ===== */
        .block-active {
            background: linear-gradient(135deg, #ffe082, #ff8f00);
            box-shadow:
                inset 0 2px 0 rgba(255,255,255,0.7),
                inset 0 -2px 0 rgba(0,0,0,0.4),
                0 0 12px rgba(255,179,0,0.7),
                0 0 24px rgba(255,179,0,0.3);
            border: 1.5px solid #ffb300;
            border-radius: 8px;
        }
        .block-locked {
            background: linear-gradient(135deg, #0d2a5e, #1a3a7a);
            box-shadow:
                inset 0 1px 0 rgba(0,245,255,0.4),
                inset 0 -1px 0 rgba(0,0,0,0.5),
                0 0 8px rgba(0,245,255,0.25);
            border: 1px solid rgba(0,245,255,0.35);
            border-radius: 8px;
        }
        .block-ghost {
            background: rgba(0,245,255,0.04);
            border: 1.5px dashed rgba(0,245,255,0.25);
            border-radius: 8px;
        }
        /* JOKER WILDCARD BLOCK - rainbow shifting glow */
        .block-joker {
            background: linear-gradient(135deg, #ff006e, #8338ec, #3a86ff, #06ffa5);
            background-size: 300% 300%;
            animation: jokerShift 2s ease infinite;
            box-shadow: 0 0 14px rgba(131,56,236,0.8), 0 0 28px rgba(0,245,255,0.4);
            border: 1.5px solid rgba(255,255,255,0.6);
            border-radius: 8px;
        }
        @keyframes jokerShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* 2× SCORE MULTIPLIER BLOCK */
        .block-multiplier {
            background: linear-gradient(135deg, #4a0000, #cc2200);
            box-shadow: 0 0 12px rgba(255,100,0,0.7), 0 0 24px rgba(255,100,0,0.3);
            border: 1.5px solid #ff6400;
            border-radius: 8px;
        }

        /* ===== GAME GRID ===== */
        .game-grid-bg {
            background: #030711;
            background-image:
                linear-gradient(rgba(0,245,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,245,255,0.03) 1px, transparent 1px);
        }

        /* SKILL BUTTONS - crystalline docks */
        .skill-dock {
            background: linear-gradient(180deg, rgba(0,245,255,0.08) 0%, rgba(0,0,20,0.8) 100%);
            border: 1px solid rgba(0,245,255,0.2);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 4px 12px rgba(0,0,0,0.5);
        }
        .skill-dock.active {
            background: linear-gradient(180deg, rgba(255,179,0,0.25) 0%, rgba(255,100,0,0.15) 100%);
            border-color: rgba(255,179,0,0.6);
            box-shadow: 0 0 16px rgba(255,179,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
        }
        .skill-dock .skill-count {
            background: rgba(0,245,255,0.15);
            border: 1px solid rgba(0,245,255,0.3);
            color: #00f5ff;
        }
        .skill-dock .skill-count.empty {
            background: rgba(255,45,156,0.2);
            border-color: rgba(255,45,156,0.4);
            color: #ff2d9c;
        }

        /* ===== UTILITY ===== */
        .locked-card { filter: grayscale(100%) contrast(80%); opacity: 0.7; pointer-events: none; }
        .clash-btn { border-bottom: 6px solid rgba(0,0,0,0.4); transition: all 0.1s; cursor: pointer; }
        .clash-btn:active { border-bottom: 0px solid transparent; transform: translateY(4px); }
        .targeting-mode { border: 4px solid #ff2d9c !important; box-shadow: 0 0 20px rgba(255,45,156,0.5); }
        .bomb-glow { animation: bombPulse 0.5s infinite alternate; background: #dc2626 !important; }
        @keyframes bombPulse { from { opacity: 0.6; transform: scale(1); } to { opacity: 1; transform: scale(1.05); } }
        .particle { position: absolute; pointer-events: none; animation: floatDown linear infinite; z-index: 0; }
        @keyframes floatDown { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(110vh) rotate(360deg); opacity: 0; } }
        .explosion-particle { position: absolute; pointer-events: none; border-radius: 50%; animation: explode 0.65s ease-out forwards; z-index: 30; }
        @keyframes explode { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; } }
        .combo-banner { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); z-index: 40; animation: comboPop 1.6s ease-out forwards; pointer-events: none; white-space: nowrap; }
        @keyframes comboPop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2) rotate(-12deg); } 25% { opacity: 1; transform: translate(-50%, -50%) scale(1.35) rotate(4deg); } 45% { transform: translate(-50%, -50%) scale(1.0); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -75%) scale(0.85); } }
        .confetti-piece { position: absolute; width: 9px; height: 9px; pointer-events: none; animation: confettiFall linear forwards; z-index: 100; border-radius: 2px; }
        @keyframes confettiFall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(105vh) rotate(720deg); opacity: 0; } }
        .star-anim { animation: starPop 0.4s ease-out forwards; transform-origin: center; opacity: 0; }
        @keyframes starPop { 0% { transform: scale(0) rotate(-30deg); opacity: 0; } 70% { transform: scale(1.4) rotate(8deg); opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
        .progress-bar-fill { transition: width 0.5s ease-out; }
        .animate-shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-6px, 0, 0); } 40%, 60% { transform: translate3d(6px, 0, 0); } }
        .freeze-overlay { position: absolute; inset: 0; background: rgba(0,245,255,0.08); backdrop-filter: blur(1px); border: 2px solid rgba(0,245,255,0.3); pointer-events: none; }
        .scramble-spin { animation: spin 0.6s ease-in-out; }
        @keyframes spin { 0% { transform: scale(1) rotate(0deg); } 50% { transform: scale(0.9) rotate(180deg); } 100% { transform: scale(1) rotate(360deg); } }
        .floating-text { animation: floatUp 1s ease-out forwards; pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1.5); } 100% { opacity: 0; transform: translateY(-50px) scale(1); } }
        .screen-fade { animation: screenFadeIn 0.2s ease-out; }
        @keyframes screenFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        .level-card-shine::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 60%); pointer-events: none; border-radius: inherit; }
        /* ambient neon glow on splash */
        .neon-glow { text-shadow: 0 0 20px currentColor, 0 0 40px currentColor; }

        const { useState, useEffect, useRef } = React;

        // --- GELİŞMİŞ SES SİSTEMİ ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const playSound = (type) => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            // Premium sound designs using multiple envelopes and frequencies
            if (type === 'click') { 
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1); 
            }
            else if (type === 'coin') { 
                osc.type = 'sine'; osc.frequency.setValueAtTime(900, now); osc.frequency.setValueAtTime(1200, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3); 
            }
            else if (type === 'match') { 
                osc.type = 'triangle'; osc.frequency.setValueAtTime(440, now); osc.frequency.exponentialRampToValueAtTime(880, now + 0.3);
                gainNode.gain.setValueAtTime(0.4, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now); osc.stop(now + 0.4); 
            }
            else if (type === 'win') {
                osc.type = 'square'; osc.frequency.setValueAtTime(400, now); osc.frequency.setValueAtTime(600, now + 0.2); osc.frequency.setValueAtTime(800, now + 0.4);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.8);
                osc.start(now); osc.stop(now + 0.8); 
            }
            else if (type === 'lose') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.6);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.6);
                osc.start(now); osc.stop(now + 0.6); 
            }
        };

        let musicInterval;
        let isMusicPlaying = false;
        let musicNotes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88]; // C Major scale
        const startMusic = () => {
            if(isMusicPlaying) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            isMusicPlaying = true;
            let step = 0;
            musicInterval = setInterval(() => {
                if(!isMusicPlaying) return clearInterval(musicInterval);
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                
                // Generative pattern: Arpeggio + Random
                let noteFreq = musicNotes[(step * 2 + Math.floor(Math.random() * 2)) % musicNotes.length];
                // Drop octave occasionally
                if (Math.random() > 0.8) noteFreq /= 2;
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(noteFreq, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                
                osc.start(now);
                osc.stop(now + 0.3);
                step++;
            }, 300); // 200 BPM 1/4 notes roughly
        };
        const stopMusic = () => {
            isMusicPlaying = false;
            clearInterval(musicInterval);
        };

                                                        </button>

                                                </div>
                                            );

            return (

                            {/* Shine overlay */}
                            <div className="absolute inset-0 bg-gradient-to-br from-white/10 to-transparent pointer-events-none"></div>
                            
                            <div className="relative p-6">
                                {/* Level header */}

                                {/* Words to find */}
                                <div className="bg-black/35 rounded-2xl p-3 mb-4 border border-white/10">
                                    <p className="text-[9px] font-black text-white/40 uppercase tracking-widest mb-2">{t('words_to_find')}</p>
                                    <div className="flex flex-wrap gap-2">
                                        {t(currentLevel.wordsKey).map(w => (
                                            <span key={w} className="bg-white/15 border border-white/20 px-3 py-1.5 rounded-xl font-black text-white text-sm shadow-inner tracking-wider">
                                                {w}

                                {/* Target score */}
                                <div className="flex items-center justify-between text-sm mb-5">
                                    <div className="flex items-center gap-1.5 bg-black/30 px-3 py-1.5 rounded-full border border-white/10">

                                </button>
                                <button onClick={() => { playSound('click'); onStart(currentLevel); }}
                                    className="w-full clash-btn bg-gradient-to-t from-green-700 to-green-500 text-white font-black py-4 rounded-2xl border-b-[6px] border-green-900 text-xl shadow-xl uppercase tracking-wider">
                                    {t('start_game')}
                                </button>
                            </div>
                        </div>

                        {/* Progress indicator */}
                        <div className="mt-4 flex items-center gap-2">
                            <div className="flex-1 h-1 bg-gray-800 rounded-full overflow-hidden">
                                <div className="h-full bg-gradient-to-r from-yellow-500 to-green-400 rounded-full progress-bar-fill" style={{width: Math.min(100, (progress / levels.length) * 100) + '%'}}></div>
                            </div>
                            <p className="text-xs font-bold text-white/40">{progress}/{levels.length}</p>
                        </div>
                    </div>
                </div>
            );
        };

        const Shop = ({ t, coins, setCoins, inventory, setInventory }) => {
            const [adState, setAdState] = useState(null);
            const [buying, setBuying] = useState(null);
            const watchAd = async () => {
                const AdMob = window.Capacitor?.Plugins?.AdMob;
                if (AdMob) {
                    try {
                        setAdState('watching');
                        await AdMob.prepareRewardVideoAd({ adId: "ca-app-pub-3940256099942544/5224354917", isTesting: true });
                        await AdMob.showRewardVideoAd();
                        setCoins(prev => prev + 100);
                        setAdState(null);
                        playSound('coin');
                    } catch (e) {
                        console.error(e);
                        setAdState(null);
                    }
                } else {
                    setAdState('watching');
                    setTimeout(() => {
                        setCoins(prev => prev + 100);
                        setAdState(null);
                        playSound('coin');
                    }, 3000);
                }
            };
            const buy = (id, price) => {
                if (coins >= price) {
                    setCoins(prev => prev - price);
                    setInventory(prev => ({ ...prev, [id]: prev[id] + 1 }));
                    playSound('coin');
                    setBuying(id);
                    setTimeout(() => setBuying(null), 600);
                }
            };
            const items = [
                { id: 'bomb',    icon: '💣', price: 200, color: 'from-red-600 to-orange-700', border: 'border-red-900', label: t('bomb'), desc: '3×3 alan temizler' },
                { id: 'freeze',  icon: '❄️', price: 100, color: 'from-cyan-500 to-blue-700',  border: 'border-blue-900', label: t('freeze'), desc: '4 sn oyunu durdurur' },
                { id: 'shuffle', icon: '🔀', price: 100, color: 'from-purple-500 to-indigo-700', border: 'border-indigo-900', label: t('scramble'), desc: 'Parçayı yeniler' },
            ];
            return (
                <div className="h-full overflow-y-auto bg-gradient-to-b from-gray-950 to-gray-900">
                    <div className="p-4 pb-28 space-y-4">
                        {/* Header */}
                        <div className="text-center pt-2 pb-1">
                            <h1 className="clash-font text-3xl text-white">{t('shop')}</h1>
                            <p className="text-white/40 text-xs font-bold uppercase tracking-widest">Güçlendiriciler</p>
                        </div>

                        {/* Watch Ad Banner */}
                        <div onClick={!adState ? watchAd : null} className={`relative overflow-hidden rounded-3xl p-5 cursor-pointer border border-purple-500/30 bg-gradient-to-br from-purple-900/80 to-pink-900/80 shadow-2xl ${adState ? 'opacity-70' : 'active:scale-95'} transition-all`}>
                            <div className="absolute inset-0 bg-gradient-to-r from-white/5 to-transparent pointer-events-none"></div>
                            {adState === 'watching' ? (
                                <div className="flex items-center justify-center gap-3">
                                    <div className="w-5 h-5 border-2 border-white/60 border-t-white rounded-full animate-spin"></div>
                                    <p className="clash-font text-lg text-white">Video İzleniyor...</p>
                                </div>
                            ) : (
                                <div className="flex items-center justify-between">
                                    <div>
                                        <p className="clash-font text-xl text-white">{t('free_gold')}</p>
                                        <p className="text-purple-200 text-sm font-bold mt-0.5">{t('watch_video')}</p>
                                    </div>
                                    <div className="w-14 h-14 bg-white/20 rounded-2xl flex items-center justify-center border border-white/30">
                                        <Icons.Video size={28} color="white" />
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Items grid */}
                        <div className="grid grid-cols-1 gap-3">
                            {items.map(item => {
                                const canBuy = coins >= item.price;
                                const isAnimating = buying === item.id;
                                return (
                                    <div key={item.id} className={`flex items-center gap-4 p-4 rounded-3xl border bg-gray-800/80 border-white/10 shadow-xl transition-all ${isAnimating ? 'scale-95' : ''}`}>
                                        <div className={`w-16 h-16 rounded-2xl flex items-center justify-center text-3xl flex-shrink-0 bg-gradient-to-br ${item.color} shadow-lg border-b-4 ${item.border}`}>
                                            {item.icon}
                                        </div>
                                        <div className="flex-1">
                                            <div className="flex items-center gap-2 mb-0.5">
                                                <p className="clash-font text-white text-base">{item.label}</p>
                                                <span className="bg-gray-700 text-white/60 text-[9px] font-bold px-2 py-0.5 rounded-full border border-white/10">{t('stock')}: {inventory[item.id]}</span>
                                            </div>
                                            <p className="text-white/40 text-xs font-medium">{item.desc}</p>
                                        </div>
                                        <button onClick={() => buy(item.id, item.price)} disabled={!canBuy}
                                            className={`flex-shrink-0 clash-btn py-2 px-4 rounded-2xl font-black text-sm border-b-4 ${canBuy ? 'bg-gradient-to-t from-yellow-600 to-yellow-400 border-yellow-900 text-[#3a2000]' : 'bg-gray-700 border-gray-900 text-gray-500 opacity-50 cursor-not-allowed'}`}>
                                            {item.price} 🟡
                                        </button>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const Game = ({ t, level, inventory, setInventory, controlType, addCoins, onBack, onWin }) => {

            const [grid, setGrid] = useState(Array(GRID_HEIGHT).fill(null).map(() => Array(GRID_WIDTH).fill(null).map(() => ({ letter: null }))));
            const [piece, setPiece] = useState(null);
            const [pos, setPos] = useState({ x: 3, y: 0 });
            const [score, setScore] = useState(0);
            const [over, setOver] = useState(false);
            const [win, setWin] = useState(false);
            const [isTargeting, setIsTargeting] = useState(false);
            const [isFrozen, setIsFrozen] = useState(false); // freeze skill: separate from targeting
            const [vfx, setVfx] = useState({ shake: false, scramble: false });
            const [floatingTexts, setFloatingTexts] = useState([]);
            const [explosions, setExplosions] = useState([]);
            const [comboDisplay, setComboDisplay] = useState(null);
            // Use refs for combo to avoid stale closure bug
            const comboRef = useRef(1);
            const lastMatchTimeRef = useRef(0);
            const gameLoopRef = useRef(null);
            const touchRef = useRef(null);
            const textIdCounter = useRef(0);
            const explIdCounter = useRef(0);
            const gridRef = useRef(grid);
            useEffect(() => { gridRef.current = grid; }, [grid]);

            // Hardware back button support
            useEffect(() => {
                const App = window.Capacitor?.Plugins?.App;
                if (App) {
                    const handler = App.addListener('backButton', onBack);
                    return () => handler.then(h => h.remove()).catch(()=>{});
                }
            }, []);

            const getDynamicLetters = () => {
                const words = t(level.wordsKey) || [];
                if (!words.length) return 'SAHTAR'.split('');
                
                const wordLetters = words.join('').split('').filter(c => c.trim());
                const uniqueWordLetters = [...new Set(wordLetters)];
                
                const weightedPool = [];
                
                // Target letters appear VERY frequently (weight: 20 each)
                uniqueWordLetters.forEach(l => {
                    for (let i = 0; i < 20; i++) weightedPool.push(l);
                });
                
                // Decoy letters appear very rarely (only 1 or 2 in the entire pool)
                const allDecoys = 'ABCDEFGHIJKLMNOPRSTUVYZ'.split('').filter(c => !uniqueWordLetters.includes(c));
                const decoyCount = 1; // Extremely low decoy rate
                for (let i = 0; i < decoyCount; i++) {
                    const decoy = allDecoys[Math.floor(Math.random() * allDecoys.length)];
                    weightedPool.push(decoy);
                }
                
                return weightedPool;
            };

            const computeGhost = (p, pPos) => {
                if (!p) return null;
                let ghostY = pPos.y;
                while (true) {
                    const testPos = { x: pPos.x, y: ghostY + 1 };
                    let blocked = false;
                    for (let py = 0; py < p.length; py++) {
                        for (let px = 0; px < p[py].length; px++) {
                            if (!p[py][px]) continue;
                            const ny = testPos.y + py, nx = testPos.x + px;
                            if (nx < 0 || nx >= GRID_WIDTH || ny >= GRID_HEIGHT) { blocked = true; break; }
                            if (ny >= 0 && gridRef.current[ny][nx].letter) { blocked = true; break; }
                        }
                        if (blocked) break;
                    }
                    if (blocked) break;
                    ghostY++;
                }
                return ghostY;
            };


            const spawn = () => {
                if(over || win) return;
                const availableLetters = getDynamicLetters();
                const shape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
                // 5% chance joker, 5% chance multiplier, rest normal
                const roll = Math.random();
                const blockType = roll < 0.05 ? 'joker' : roll < 0.10 ? 'multiplier' : 'normal';
                const newPiece = shape.map(row => row.map(cell => cell ? { 
                    letter: blockType === 'joker' ? '★' : blockType === 'multiplier' ? '2×' : availableLetters[Math.floor(Math.random() * availableLetters.length)],
                    type: blockType
                } : null));
                setPiece(newPiece);
                const startPos = { x: Math.floor(GRID_WIDTH / 2) - 1, y: -1 };
                if(checkCollision(newPiece, startPos)) setOver(true);
                else setPos(startPos);
            };

            useEffect(() => { spawn(); }, []);

            const checkCollision = (p, pPos) => {
                for(let y=0; y<p.length; y++){
                    for(let x=0; x<p[y].length; x++){
                        if(p[y][x]){
                            const nx = pPos.x + x, ny = pPos.y + y;
                            if(nx < 0 || nx >= GRID_WIDTH || ny >= GRID_HEIGHT) return true;
                            if(ny >= 0 && grid[ny][nx].letter) return true;
                        }
                    }
                }
                return false;
            };

            useEffect(() => {
                if(over || win || isTargeting || isFrozen) return;
                const speed = Math.max(200, 1000 - (level.id * 50) - (score / 8));
                gameLoopRef.current = setInterval(() => {
                    const newPos = {...pos, y: pos.y + 1};
                    if(!checkCollision(piece, newPos)) setPos(newPos);
                    else lock();
                }, speed);
                return () => clearInterval(gameLoopRef.current);
            }, [piece, pos, grid, over, win, isTargeting, isFrozen]);

            const lock = () => {
                const newGrid = grid.map(r => [...r]);
                piece.forEach((row, y) => row.forEach((cell, x) => {
                    if(cell && pos.y + y >= 0) {
                        // Joker becomes the best matching letter
                        if(cell.type === 'joker') {
                            const wordLetters = (t(level.wordsKey)||[]).join('').split('').filter(c=>c.trim());
                            const needed = wordLetters[Math.floor(Math.random()*wordLetters.length)] || 'A';
                            newGrid[pos.y + y][pos.x + x] = { letter: needed, type: 'locked' };
                        } else if(cell.type === 'multiplier') {
                            // Multiplier clears its spot and adds bonus score
                            newGrid[pos.y + y][pos.x + x] = { letter: null };
                            setScore(s => Math.min(s + 30, level.target)); // bonus points
                        } else {
                            newGrid[pos.y + y][pos.x + x] = cell;
                        }
                    }
                }));
                
                let matchCount = 0;
                let matchPositions = [];

                // Horizontal matches
                for(let y=0; y<GRID_HEIGHT; y++){
                    let rowStr = newGrid[y].map(c => c.letter || ' ').join('');
                    t(level.wordsKey).forEach(w => {
                        let idx = rowStr.indexOf(w);
                        while(idx !== -1){
                            matchCount++;
                            matchPositions.push({x: idx + w.length/2, y});
                            for(let i=0; i<w.length; i++) newGrid[y][idx+i] = {letter: null};
                            rowStr = newGrid[y].map(c => c.letter || ' ').join('');
                            idx = rowStr.indexOf(w);
                        }
                    });
                }

                // Vertical matches
                for(let x=0; x<GRID_WIDTH; x++){
                    let colStr = newGrid.map(row => row[x].letter || ' ').join('');
                    t(level.wordsKey).forEach(w => {
                        let idx = colStr.indexOf(w);
                        while(idx !== -1){
                            matchCount++;
                            matchPositions.push({x, y: idx + w.length/2});
                            for(let i=0; i<w.length; i++) newGrid[idx+i][x] = {letter: null};
                            colStr = newGrid.map(row => row[x].letter || ' ').join('');
                            idx = colStr.indexOf(w);
                        }
                    });
                }
                
                if(matchCount > 0) {
                    playSound('match');
                    
                    // Combo logic using refs to avoid stale closure
                    const now = Date.now();
                    let newCombo = 1;
                    if (now - lastMatchTimeRef.current < 5000) {
                        newCombo = comboRef.current + 1;
                    }
                    comboRef.current = newCombo;
                    lastMatchTimeRef.current = now;

                    const points = matchCount * 50 * newCombo;
                    setScore(s => {
                        const ns = s + points;
                        if(ns >= level.target) setWin(true);
                        return ns;
                    });
                    
                    // Floating score text
                    matchPositions.forEach(p => {
                        const id = textIdCounter.current++;
                        setFloatingTexts(prev => [...prev, { id, text: `+${points}`, x: p.x, y: p.y }]);
                        setTimeout(() => setFloatingTexts(prev => prev.filter(t => t.id !== id)), 1000);
                    });

                    // Explosion particles at match positions
                    const colors = ['#facc15','#f87171','#34d399','#60a5fa','#e879f9'];
                    matchPositions.forEach(p => {
                        const particles = Array.from({length:8}).map((_, i) => {
                            const angle = (i / 8) * Math.PI * 2;
                            const dist = 30 + Math.random() * 30;
                            return {
                                id: explIdCounter.current++,
                                x: p.x * CELL_SIZE + CELL_SIZE/2,
                                y: p.y * CELL_SIZE + CELL_SIZE/2,
                                tx: Math.cos(angle) * dist,
                                ty: Math.sin(angle) * dist,
                                color: colors[Math.floor(Math.random() * colors.length)],
                                size: 4 + Math.random() * 5
                            };
                        });
                        setExplosions(prev => [...prev, ...particles]);
                        setTimeout(() => setExplosions(prev => prev.filter(e => !particles.find(p => p.id === e.id))), 700);
                    });

                    // Show COMBO banner if combo > 1
                    if (newCombo > 1) {
                        const cid = textIdCounter.current++;
                        setComboDisplay({id: cid, text: `🔥 COMBO x${newCombo}!`});
                        setTimeout(() => setComboDisplay(null), 1800);
                    }

                    // Gravity  
                    for(let x=0; x<GRID_WIDTH; x++){
                        let write = GRID_HEIGHT - 1;
                        for(let y=GRID_HEIGHT-1; y>=0; y--){
                            if(newGrid[y][x].letter){
                                const temp = newGrid[y][x];
                                newGrid[y][x] = {letter: null};
                                newGrid[write][x] = temp;
                                write--;
                            }
                        }
                    }
                } else {
                    setScore(s => s + 2);
                }

                setGrid(newGrid); // FIX: was called twice before
                spawn();
            };


            const useSkill = (type) => {
                if(inventory[type] <= 0) return;
                if(type === 'bomb') { setIsTargeting(true); playSound('click'); }
                else if(type === 'shuffle' && piece) {
                    const availableLetters = getDynamicLetters();
                    const shuffled = piece.map(row => row.map(cell => cell ? { 
                        letter: availableLetters[Math.floor(Math.random() * availableLetters.length)]
                    } : null));
                    setPiece(shuffled);
                    setInventory(prev => ({...prev, shuffle: prev.shuffle - 1}));
                    playSound('click');
                    setVfx(v => ({...v, scramble: true}));
                    setTimeout(() => setVfx(v => ({...v, scramble: false})), 600);
                } else if(type === 'freeze') {
                    // FIX: freeze slows but does NOT set isTargeting (which pauses loop)
                    setInventory(prev => ({...prev, freeze: prev.freeze - 1}));
                    playSound('click');
                    setIsFrozen(true);
                    setTimeout(() => setIsFrozen(false), 4000);
                }
            };

            const handleGridClick = (y, x) => {
                if(isTargeting){
                    const newGrid = grid.map(r => [...r]);
                    for(let dy=-1; dy<=1; dy++){
                        for(let dx=-1; dx<=1; dx++){
                            const ny = y+dy, nx = x+dx;
                            if(ny >=0 && ny < GRID_HEIGHT && nx >=0 && nx < GRID_WIDTH) newGrid[ny][nx] = {letter: null};
                        }
                    }
                    setGrid(newGrid);
                    setIsTargeting(false);
                    setInventory(prev => ({...prev, bomb: prev.bomb - 1}));
                    playSound('match');
                    setVfx(v => ({...v, shake: true}));
                    setTimeout(() => setVfx(v => ({...v, shake: false})), 500);
                }
            };

            const handleTouch = (e, type) => {
                if(isTargeting || controlType === 'buttons') return;
                if(type === 'start') touchRef.current = {x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now()};
                else if(type === 'end' && touchRef.current){
                    const dx = e.changedTouches[0].clientX - touchRef.current.x;
                    const dy = e.changedTouches[0].clientY - touchRef.current.y;
                    const dt = Date.now() - touchRef.current.t;
                    if(dt < 220 && Math.abs(dx) < 15 && Math.abs(dy) < 15) {
                        // Tap = rotate
                        const rot = piece[0].map((_, i) => piece.map(row => row[i]).reverse());
                        if(!checkCollision(rot, pos)) setPiece(rot);
                    } else if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 25) {
                        // Horizontal swipe = move
                        const nx = pos.x + (dx > 0 ? 1 : -1);
                        if(!checkCollision(piece, {x: nx, y: pos.y})) setPos(p => ({...p, x: nx}));
                    } else if(dy > 50) {
                        // Swipe DOWN = hard drop (FIX: was reversed before)
                        let ny = pos.y;
                        while(!checkCollision(piece, {x: pos.x, y: ny + 1})) ny++;
                        setPos(p => ({...p, y: ny}));
                    }
                }
            };

            const handleButton = (action) => {
                if(isTargeting || over || win || !piece) return;
                playSound('click');
                if(action === 'left') {
                    const nx = pos.x - 1;
                    // clamp to grid: checkCollision already handles left wall
                    if(!checkCollision(piece, {x: nx, y: pos.y})) setPos(p => ({...p, x: nx}));
                } else if(action === 'right') {
                    const nx = pos.x + 1;
                    if(!checkCollision(piece, {x: nx, y: pos.y})) setPos(p => ({...p, x: nx}));
                } else if(action === 'down') {
                    // hard drop - ensure piece lands cleanly inside grid
                    let ny = pos.y;
                    while(!checkCollision(piece, {x: pos.x, y: ny + 1}) && ny < GRID_HEIGHT - 1) ny++;
                    setPos(p => ({...p, y: ny}));
                    setTimeout(() => lock(), 50);
                } else if(action === 'rotate') {
                    const rot = piece[0].map((_, i) => piece.map(row => row[i]).reverse());
                    // Wall-kick: if rotation goes out of bounds, try shifting left/right
                    if(!checkCollision(rot, pos)) {
                        setPiece(rot);
                    } else if(!checkCollision(rot, {x: pos.x - 1, y: pos.y})) {
                        setPiece(rot); setPos(p => ({...p, x: p.x - 1}));
                    } else if(!checkCollision(rot, {x: pos.x + 1, y: pos.y})) {
                        setPiece(rot); setPos(p => ({...p, x: p.x + 1}));
                    }
                }
            };

            const ghostY = piece ? computeGhost(piece, pos) : null;
            const stars = win ? (score >= level.target * 1.5 ? 3 : score >= level.target * 1.1 ? 2 : 1) : 0;
            const confettiColors = ['#facc15','#f87171','#34d399','#60a5fa','#e879f9','#fb923c'];
            const confettiPieces = win ? Array.from({length: 35}).map((_, i) => ({
                id: i,
                left: Math.random() * 100 + '%',
                color: confettiColors[i % confettiColors.length],
                delay: Math.random() * 1.5 + 's',
                duration: (1.8 + Math.random() * 1.5) + 's',
                rotation: Math.random() * 360
            })) : [];

            return (
                <div className="h-full relative flex flex-col items-center pt-2 pb-1" style={{background:'#040c1a'}} onTouchStart={e => handleTouch(e, 'start')} onTouchEnd={e => handleTouch(e, 'end')}>
                    {/* HUD top bar */}
                    <div className="w-full flex items-center justify-between px-3 mb-2 z-10" style={{maxWidth: GRID_WIDTH * CELL_SIZE + 16}}>
                        <div className="flex flex-col">
                            <p className="rune-font text-[9px] uppercase" style={{color:'rgba(0,245,255,0.6)',letterSpacing:'0.2em'}}>{t('target')}</p>
                            <p className="clash-font text-lg leading-tight text-white">{score} <span style={{color:'#ffb300'}}>/ {level.target}</span></p>
                        </div>
                        <div className="flex-1 mx-3 h-2.5 rounded-full overflow-hidden" style={{background:'rgba(0,245,255,0.08)',border:'1px solid rgba(0,245,255,0.15)'}}>
                            <div className="h-full rounded-full progress-bar-fill" style={{width: Math.min(100, (score / level.target) * 100) + '%', background:'linear-gradient(90deg, #00c2cc, #00f5ff, #ffb300)'}}></div>
                        </div>
                        <div className="text-xl">{level.img}</div>
                    </div>

                    <div className={`game-grid-bg relative rounded-xl border overflow-hidden shadow-2xl transition-all ${isTargeting ? 'targeting-mode' : isFrozen ? 'border-cyan-400' : ''} ${vfx.shake ? 'animate-shake' : ''} ${vfx.scramble ? 'scramble-spin' : ''}`} style={{width: GRID_WIDTH * CELL_SIZE, height: GRID_HEIGHT * CELL_SIZE, border: isTargeting ? '2px solid #ff2d9c' : isFrozen ? '2px solid #00f5ff' : '1px solid rgba(0,245,255,0.12)', boxShadow: isTargeting ? '0 0 20px rgba(255,45,156,0.6)' : isFrozen ? '0 0 20px rgba(0,245,255,0.4)' : '0 0 40px rgba(0,0,0,0.8), inset 0 0 60px rgba(0,245,255,0.02)'}}>
                        {/* Grid cells */}
                        {grid.map((r, y) => r.map((c, x) => (
                            <div key={`${y}-${x}`} 
                                 onClick={() => handleGridClick(y, x)}
                                 className={`absolute flex items-center justify-center font-black text-white text-sm ${c.letter ? 'block-locked' : ''}`}
                                 style={{width: CELL_SIZE, height: CELL_SIZE, left: x*CELL_SIZE, top: y*CELL_SIZE, borderRight:'1px solid rgba(0,245,255,0.04)', borderBottom:'1px solid rgba(0,245,255,0.04)'}}>
                                <span className={c.letter ? 'drop-shadow-md' : ''} style={{color: c.letter ? '#7ec8ff' : 'transparent', fontSize: CELL_SIZE * 0.42}}>{c.letter}</span>
                            </div>
                        )))}
                        {/* Ghost piece */}
                        {piece && ghostY !== null && ghostY !== pos.y && piece.map((r, py) => r.map((c, px) => c && (
                            <div key={`g-${py}-${px}`} className="absolute block-ghost flex items-center justify-center text-sm font-black text-yellow-200/40"
                                 style={{width: CELL_SIZE, height: CELL_SIZE, left: (pos.x+px)*CELL_SIZE, top: (ghostY+py)*CELL_SIZE}}>
                                <span>{c.letter}</span>
                            </div>
                        )))}
                        {/* Active piece */}
                        {piece && piece.map((r, py) => r.map((c, px) => c && (
                            <div key={`p-${py}-${px}`} 
                                 className={`absolute flex items-center justify-center font-black text-sm transition-all duration-75 ${
                                     c.type === 'joker' ? 'block-joker' :
                                     c.type === 'multiplier' ? 'block-multiplier' :
                                     'block-active'
                                 }`}
                                 style={{width: CELL_SIZE, height: CELL_SIZE, left: (pos.x+px)*CELL_SIZE, top: (pos.y+py)*CELL_SIZE}}>
                                <span style={{color: c.type === 'joker' ? 'white' : c.type === 'multiplier' ? '#ffb300' : '#663c00', fontSize: CELL_SIZE * 0.38, textShadow: c.type === 'joker' ? '0 0 8px white' : 'none'}}>{c.letter}</span>
                            </div>
                        )))}
                        {/* Freeze overlay */}
                        {isFrozen && <div className="freeze-overlay"><div className="absolute inset-0 flex items-center justify-center text-4xl opacity-40">❄️</div></div>}
                        {/* Floating score texts */}
                        {floatingTexts.map(ft => (
                            <div key={ft.id} className="absolute floating-text text-yellow-300 font-black text-xl z-20" style={{left: ft.x * CELL_SIZE, top: ft.y * CELL_SIZE, fontFamily:'Titan One'}}>
                                {ft.text}
                            </div>
                        ))}
                        {/* Word-match explosion particles */}
                        {explosions.map(e => (
                            <div key={e.id} className="explosion-particle" style={{left: e.x, top: e.y, width: e.size, height: e.size, background: e.color, '--tx': e.tx+'px', '--ty': e.ty+'px'}}></div>
                        ))}
                        {/* Combo banner */}
                        {comboDisplay && (
                            <div className="combo-banner clash-font text-3xl text-yellow-300 drop-shadow-[0_2px_8px_rgba(0,0,0,0.9)]" key={comboDisplay.id}>
                                {comboDisplay.text}
                            </div>
                        )}
                    </div>

                    {controlType === 'buttons' && (
                        <div className="flex justify-between w-full mt-2 z-10 gap-2 px-2" style={{maxWidth: GRID_WIDTH * CELL_SIZE + 16}}>
                            <div className="flex gap-1">
                                <button onClick={() => handleButton('left')} className="w-12 h-12 bg-blue-700/80 rounded-xl flex items-center justify-center border-b-4 border-blue-900 active:border-b-0 active:translate-y-1 transition-all text-white"><Icons.ArrowLeft size={24}/></button>
                                <button onClick={() => handleButton('down')} className="w-12 h-12 bg-blue-700/80 rounded-xl flex items-center justify-center border-b-4 border-blue-900 active:border-b-0 active:translate-y-1 transition-all text-white"><Icons.ArrowDown size={24}/></button>
                                <button onClick={() => handleButton('right')} className="w-12 h-12 bg-blue-700/80 rounded-xl flex items-center justify-center border-b-4 border-blue-900 active:border-b-0 active:translate-y-1 transition-all text-white"><Icons.ArrowRight size={24}/></button>
                            </div>
                            <button onClick={() => handleButton('rotate')} className="w-12 h-12 bg-green-600/80 rounded-xl flex items-center justify-center border-b-4 border-green-800 active:border-b-0 active:translate-y-1 transition-all text-white"><Icons.Rotate size={24}/></button>
                        </div>
                    )}

                    <div className="flex gap-3 mt-2 z-10">
                        <SkillBtn icon="💣" label="TÜMÜNÜ" count={inventory.bomb} active={isTargeting} onClick={() => useSkill('bomb')} />
                        <SkillBtn icon="🔀" label="KARIŞTIR" count={inventory.shuffle} onClick={() => useSkill('shuffle')} />
                        <SkillBtn icon="❄️" label="DONDUR" count={inventory.freeze} active={isFrozen} onClick={() => useSkill('freeze')} />
                    </div>

                    {/* Win / Lose Overlay */}
                    {(over || win) && (
                        <div className="absolute inset-0 z-50 bg-black/70 backdrop-blur-md flex flex-col items-center justify-center p-8 text-center">
                            {/* Confetti (win only) */}
                            {win && confettiPieces.map(c => (
                                <div key={c.id} className="confetti-piece" style={{left: c.left, background: c.color, animationDelay: c.delay, animationDuration: c.duration, transform: `rotate(${c.rotation}deg)`}}></div>
                            ))}
                            <h2 className={`clash-font text-5xl mb-3 drop-shadow-[0_4px_10px_rgba(0,0,0,0.8)] ${win ? 'text-green-400' : 'text-red-400'}`}>{win ? t('level_win') : t('level_lose')}</h2>
                            {/* Star rating */}
                            {win && (
                                <div className="flex gap-2 mb-3">
                                    {[1,2,3].map(s => (
                                        <span key={s} className="text-4xl star-anim" style={{animationDelay: (s * 0.25) + 's'}}>{s <= stars ? '⭐' : '☆'}</span>
                                    ))}
                                </div>
                            )}
                            <p className="text-white text-xl mb-8 font-bold bg-black/50 px-6 py-2 rounded-full border border-white/20">{t('score')}: <span className="text-yellow-400">{score}</span></p>
                            <button onClick={win ? onWin : onBack} className="clash-btn bg-gradient-to-t from-gray-300 to-white text-black clash-font text-xl py-4 px-10 rounded-[2rem] border-b-[8px] border-gray-500 active:border-b-0 w-full max-w-xs shadow-xl uppercase">
                                {win ? t('next_level') : t('try_again')}
                            </button>
                            {win && <button onClick={onBack} className="mt-3 text-white/60 font-bold text-sm underline">{t('main_menu')}</button>}
                        </div>
                    )}
                </div>
            );
        };

        const SkillBtn = ({ icon, count, onClick, active, label }) => (
            <button onClick={onClick} className={`flex flex-col items-center gap-1 transition-all active:scale-90 ${active ? 'scale-105' : ''}`}>
                <div className={`w-16 h-16 rounded-2xl flex flex-col items-center justify-center text-2xl relative skill-dock ${active ? 'active' : ''}`}>
                    <span>{icon}</span>
                    {label && <span className="text-[8px] font-bold mt-0.5" style={{color:'rgba(0,245,255,0.7)',letterSpacing:'0.05em'}}>{label}</span>}
                    <div className={`absolute -top-1.5 -right-1.5 text-[9px] w-5 h-5 flex items-center justify-center rounded-full font-black skill-count ${count > 0 ? '' : 'empty'}`}>{count}</div>
                </div>
            </button>
        );


        const SettingsScreen = ({ t, language, setLanguage, controlType, setControlType, isPlayConnected, setIsPlayConnected, onReset }) => {
            const [musicOn, setMusicOn] = useState(isMusicPlaying);
            const toggleMusic = () => { if(musicOn) stopMusic(); else startMusic(); setMusicOn(!musicOn); };
            const langs = [{ code:'tr', flag:'🇹🇷' }, { code:'en', flag:'🇬🇧' }, { code:'ar', flag:'🇸🇦' }];

            const Card = ({ children }) => (
                <div className="w-full bg-gray-800/80 rounded-3xl border border-white/10 overflow-hidden shadow-xl">{children}</div>
            );
            const Row = ({ label, children }) => (
                <div className="flex items-center justify-between px-5 py-4 border-b border-white/5 last:border-0">
                    <p className="text-sm font-bold text-white/70">{label}</p>
                    {children}
                </div>
            );

            return (
                <div className="h-full overflow-y-auto bg-gradient-to-b from-gray-950 to-gray-900">
                    <div className="p-4 space-y-4 pb-28">
                        <div className="text-center pt-2 pb-1">
                            <h1 className="clash-font text-3xl text-white">{t('settings')}</h1>
                        </div>

                        <Card>
                            <Row label={t('language')||'Dil'}>
                                <div className="flex gap-2">
                                    {langs.map(l => (
                                        <button key={l.code} onClick={() => setLanguage(l.code)}
                                            className={`px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 border-b-2 transition-all ${language===l.code ? 'bg-yellow-400/20 border-yellow-500 text-yellow-300 shadow-[0_0_10px_rgba(250,204,21,0.3)]' : 'bg-gray-700 border-gray-900 text-white/60 opacity-70'}`}>
                                            <span className="text-base">{l.flag}</span>
                                            <span>{t(`language_${l.code}`) || l.code.toUpperCase()}</span>
                                        </button>
                                    ))}
                                </div>
                            </Row>
                            <Row label={t('control_type')}>
                                <div className="flex bg-gray-900 rounded-xl p-1 gap-1">
                                    {['swipe', 'buttons'].map(c => (
                                        <button key={c} onClick={() => { playSound('click'); setControlType(c); }}
                                            className={`px-4 py-2 rounded-lg font-black text-xs uppercase transition-all ${controlType===c ? 'bg-blue-600 text-white shadow-sm' : 'text-gray-500'}`}>
                                            {t(c)}
                                        </button>
                                    ))}
                                </div>
                            </Row>
                            <Row label={t('music')}>
                                <button onClick={toggleMusic} className={`w-14 h-7 rounded-full transition-all border-2 flex items-center ${musicOn ? 'bg-green-500 border-green-700 justify-end' : 'bg-gray-700 border-gray-900 justify-start'}`}>
                                    <div className="w-5 h-5 rounded-full bg-white m-0.5 shadow-md"></div>
                                </button>
                            </Row>
                            <Row label="Google Play">
                                <button onClick={() => { playSound('coin'); setIsPlayConnected(!isPlayConnected); }}
                                    className={`px-4 py-2 rounded-lg font-black text-xs uppercase transition-all shadow-md ${isPlayConnected ? 'bg-green-600 border-b-2 border-green-800 text-white' : 'bg-gray-700 border-b-2 border-gray-900 text-white'}`}>
                                    {isPlayConnected ? 'Bağlandı 🎮' : 'Bağlan 🎮'}
                                </button>
                            </Row>
                        </Card>

                        <button onClick={onReset}
                            className="w-full clash-btn bg-gradient-to-t from-red-800 to-red-600 text-white font-black py-4 rounded-2xl border-b-4 border-red-900 uppercase shadow-xl">
                            🗑️ {t('reset_data')}
                        </button>
                    </div>
                </div>
            );
        };

        const Leaderboard = ({ t, progress, username, avatar, isPlayConnected }) => {
            const friends = [
                { name: "Alp_Pro", level: Math.max(1, progress + 2), avatar: AVATARS[1], isMe: false },
                { name: username, level: progress + 1, avatar: avatar, isMe: true },
                { name: "Selin", level: Math.max(1, progress - 1), avatar: AVATARS[2], isMe: false },
                { name: "Mertx", level: Math.max(1, progress - 3), avatar: AVATARS[3], isMe: false },
                { name: "Oyuncu102", level: Math.max(1, progress - 4), avatar: AVATARS[4], isMe: false }
            ].sort((a,b) => b.level - a.level);

            return (
                <div className="h-full overflow-y-auto bg-gradient-to-b from-gray-950 to-gray-900">
                    <div className="p-4 pb-28 space-y-4">
                        <div className="text-center pt-2 pb-1">
                            <h1 className="clash-font text-3xl text-white">🏆 {t('leaderboard') || 'Liderlik'}</h1>
                            <p className="text-white/40 text-xs font-bold uppercase tracking-widest">{t('friends') || 'Arkadaşlar'}</p>
                        </div>
                        
                        {!isPlayConnected && (
                            <div className="bg-blue-900/30 border border-blue-500/50 rounded-2xl p-4 text-center mb-4">
                                <p className="text-xs text-blue-200 mb-2">Google Play hesabınızı bağlayarak ilerlemenizi kaydedin ve arkadaşlarınızı görün!</p>
                                <p className="text-[10px] text-white/40">(Ayarlar'dan bağlanabilirsiniz)</p>
                            </div>
                        )}

                        <div className="grid grid-cols-1 gap-3">
                            {friends.map((f, i) => (
                                <div key={i} className={`flex items-center gap-4 p-4 rounded-3xl border shadow-xl ${f.isMe ? 'bg-yellow-900/40 border-yellow-500/50' : 'bg-gray-800/80 border-white/10'} ${!isPlayConnected && !f.isMe ? 'opacity-40 blur-[2px]' : ''}`}>
                                    <div className={`font-black text-2xl w-6 text-center ${i===0?'text-yellow-400':i===1?'text-gray-300':i===2?'text-orange-400':'text-white/30'}`}>{i+1}</div>
                                    <img src={f.avatar} className="w-14 h-14 rounded-full border-2 border-white/20 bg-blue-900 object-cover" />
                                    <div className="flex-1">
                                        <p className={`clash-font text-lg ${f.isMe ? 'text-yellow-400' : 'text-white'}`}>{f.isMe ? f.name : (isPlayConnected ? f.name : '????')}</p>
                                    </div>
                                    <div className="flex flex-col items-center">
                                        <span className="text-[10px] text-white/40 font-bold uppercase">{t('mission') || 'Görev'}</span>
                                        <span className="clash-font text-2xl text-yellow-500">{f.isMe ? f.level : (isPlayConnected ? f.level : '?')}</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };


        const NavButton = ({ icon: Icon, label, active, onClick }) => (
            <button onClick={() => { playSound('click'); onClick(); }}
                className={`flex flex-col items-center gap-1 px-4 py-2 transition-all ${active ? '' : 'opacity-50'}`}>
                <div className={`w-10 h-10 rounded-xl flex items-center justify-center transition-all ${active ? 'bg-white/15 border border-white/20 shadow-[0_0_12px_rgba(255,255,255,0.1)]' : ''}`}>
                    <Icon size={22} color={active ? 'white' : '#6b7280'} />
                </div>
                <span className={`text-[9px] font-black uppercase tracking-wide ${active ? 'text-white' : 'text-gray-500'}`}>{label}</span>
            </button>
        );


        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(registration => {
                    console.log('SW kayıt başarılı:', registration.scope);
                }).catch(err => {
                    console.log('SW kayıt hatası:', err);
                });
            });
        }
    </script>
</body>
</html>
